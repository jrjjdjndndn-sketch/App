name: Release Signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Silero VAD
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/silero_vad.onnx \
            "[github.com](https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx)"

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.jks

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
