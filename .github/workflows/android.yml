name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ───────────────────────────────────────────────────────────
      # 1) Checkout
      # ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────
      # 2) فك الضغط (لو المشروع متحطّط كـ GeminiAgent.zip)
      #    لو شايل الملفات مباشرة بدون zip — شيل الخطوة دي.
      # ───────────────────────────────────────────────────────────
      - name: Unzip project (if zipped)
        run: |
          if [ -f GeminiAgent.zip ]; then
            echo "Found GeminiAgent.zip → unzipping…"
            unzip -q -o GeminiAgent.zip
          else
            echo "No zip found, assuming sources are already in the repo."
          fi

      # ───────────────────────────────────────────────────────────
      # 3) JDK 21 (مطلوب لـ AGP 8.7+ و Kotlin 2.0.20+)
      # ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ───────────────────────────────────────────────────────────
      # 4) ابحث عن مجلد المشروع (اللي فيه settings.gradle.kts)
      #    واحفظ المسار في GITHUB_ENV عشان كل الخطوات اللي بعدها
      #    تستعمله بدل ما نكرر `find` كل مرة.
      # ───────────────────────────────────────────────────────────
      - name: Locate project root
        run: |
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found anywhere in the workspace!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root → $PROJECT_DIR"

      # ───────────────────────────────────────────────────────────
      # 5) Setup Gradle مع caching تلقائي للـ dependencies
      #    (يوفّر 2-5 دقائق على كل run بعد الأول)
      # ───────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ───────────────────────────────────────────────────────────
      # 6) ولّد ملف gradlew + gradle-wrapper.jar لو مش موجودين
      #    (إحنا في الـ workspace معانا gradle-wrapper.properties بس)
      # ───────────────────────────────────────────────────────────
      - name: Generate Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradlew missing → generating wrapper (matching properties file)…"
            # اقرأ الـ version من الـ properties لو موجود
            VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "8.10.2")
            echo "Using Gradle $VERSION"
            gradle wrapper --gradle-version "$VERSION" --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      # ───────────────────────────────────────────────────────────
      # 7) بناء الـ Debug APK
      # ───────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ───────────────────────────────────────────────────────────
      # 8) اعرض حجم ومسار الـ APK (يساعد على debugging)
      # ───────────────────────────────────────────────────────────
      - name: List built APKs
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "==== Built APKs ===="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      # ───────────────────────────────────────────────────────────
      # 9) ارفع الـ APK كـ artifact للتحميل
      # ───────────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAgent-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
