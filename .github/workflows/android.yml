name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع الخاص بك
    - name: Unzip Project Files
      run: unzip GeminiAgent.zip

    # 2. إعداد الجافا المتوافقة مع عام 2026
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. إعطاء صلاحية التشغيل لملف البناء التلقائي بمرونة عالية
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        else
          find . -name "gradlew" -exec chmod +x {} \;
        fi

    # 4. البحث عن المجلد وبناء نسخة الـ APK
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!" && exit 1
        fi
        DIR_PATH=$(dirname "$GRADLEW_PATH")
        cd "$DIR_PATH"
        ./gradlew assembleDebug

    # 5. استخراج ملف الـ APK النهائي وحفظه للتحميل
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
