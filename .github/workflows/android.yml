name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. فك ضغط ملف المشروع الخاص بك
    - name: Unzip Project Files
      run: unzip GeminiAgent.zip

    # 2. إعداد الجافا 21 (مطلوب لـ TargetSdk 35 و Kotlin 2.0.20+)
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. توليد ملف gradlew بالإصدار المطلوب 8.9 تلقائياً
    - name: Generate Gradle Wrapper
      run: |
        TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          echo "Error: build.gradle.kts not found!" && exit 1
        fi
        cd "$TARGET_DIR"
        gradle wrapper --gradle-version 8.9
        chmod +x ./gradlew

    # 4. بناء نسخة الـ APK
    - name: Build with Gradle
      run: |
        TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        cd "$TARGET_DIR"
        ./gradlew assembleDebug

    # 5. استخراج ملف الـ APK النهائي وحفظه للتحميل
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
