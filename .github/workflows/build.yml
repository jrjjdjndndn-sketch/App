name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Silero VAD model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/silero_vad.onnx \
            [github.com](https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx)

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
