name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/avd
          key: android-sdk-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Cache Silero VAD
        id: cache-vad
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/silero_vad.onnx
          key: silero-vad-v5

      - name: Download Silero VAD model
        if: steps.cache-vad.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/silero_vad.onnx \
            "[github.com](https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx)"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --configuration-cache --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel --configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
